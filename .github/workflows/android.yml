name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to create a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.MB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.${{ github.run_number }}"; fi
          echo "MB_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "MB_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Shared tests
        working-directory: shared
        run: ./gradlew test

      # The ~800 Robolectric tests take a while: run them for releases only.
      - name: Android unit tests (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.MB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          MB_KEYSTORE_PASSWORD: ${{ secrets.MB_KEYSTORE_PASSWORD }}
          MB_KEY_ALIAS: ${{ secrets.MB_KEY_ALIAS }}
          MB_KEY_PASSWORD: ${{ secrets.MB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        run: |
          # the Gradle output is app-release.apk when signed, app-release-unsigned.apk otherwise
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          [ "$HAS_KEYSTORE" == "true" ] && S="" || S="-unsigned"
          cp "$APK" "moneybook-${MB_VERSION_NAME}${S}.apk"
          echo "APK_FILE=moneybook-${MB_VERSION_NAME}${S}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK_FILE" --title "MoneyBook $MB_VERSION_NAME" --generate-notes
