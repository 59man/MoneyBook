services:
  moneybook:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: moneybook
    ports:
      # IPv4 only: an IPv6 userland proxy would hide the client's source address from the server's network rules
      - "0.0.0.0:${MB_HOST_PORT:-8095}:8080"
    environment:
      MB_API_KEY: ${MB_API_KEY:-}                  # optional; when set it is the API key
      MB_TRUSTED_NETWORKS: ${MB_TRUSTED_NETWORKS:-} # empty = 100.64.0.0/10,127.0.0.0/8,::1/128
      MB_ALLOWED_HOSTS: ${MB_ALLOWED_HOSTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
      - ./backups:/backups                           # must be owned by uid 1000
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  data:
